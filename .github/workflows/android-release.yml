name: Android Release CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 环境
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. 授予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 从 GitHub Secrets 解密出证书文件
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$ENCODED_STRING" | base64 --decode > app/release.jks

      # 5. 执行 Gradle 编译命令
      - name: Build Release APK
        env:
          KEYSTORE_PATH: "release.jks"
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 6. 打印 APK 文件路径
      - name: Print APK Path
        run: |
          # 使用 find 命令查找 APK 文件
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          echo "APK file path: $APK_PATH"
          # 或者使用 ls 命令列出所有 APK 文件

      # 7. 上传 APK 到 Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-*.apk